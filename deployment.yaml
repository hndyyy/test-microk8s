apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  namespace: test-k8s
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: my-app
          image: nginx:latest  # Ganti dengan image kamu
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"  # Min 0.1 CPU
              memory: "128Mi"
            limits:
              cpu: "500m"  # Max 0.5 CPU
              memory: "512Mi"
